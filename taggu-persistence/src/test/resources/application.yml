# Tests run against an in-memory H2 in PostgreSQL mode, and apply the project's own V1 migration
# rather than a schema generated from the code, so the migration stays honest without Docker.
spring:
  datasource:
    url: jdbc:h2:mem:taggu;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
